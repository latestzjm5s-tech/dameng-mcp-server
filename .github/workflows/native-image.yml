name: Build Native Image

on:
  push:
    tags:
      - 'v*'
    branches:
      - feat/cli-stdio
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dameng-cli-linux-x64
            binary: dameng-cli
          - os: macos-latest
            artifact: dameng-cli-macos-arm64
            binary: dameng-cli
          - os: windows-latest
            artifact: dameng-cli-windows-x64
            binary: dameng-cli.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build fat JAR
        run: mvn clean package -q

      - name: Build native image
        run: |
          native-image -jar target/dameng-cli-1.0.0.jar ${{ matrix.binary == 'dameng-cli.exe' && 'dameng-cli' || matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          cp artifacts/dameng-cli-linux-x64/dameng-cli release/dameng-cli-linux-x64
          cp artifacts/dameng-cli-macos-arm64/dameng-cli release/dameng-cli-macos-arm64
          cp artifacts/dameng-cli-windows-x64/dameng-cli.exe release/dameng-cli-windows-x64.exe
          chmod +x release/dameng-cli-linux-x64 release/dameng-cli-macos-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
